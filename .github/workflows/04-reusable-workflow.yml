name: Reusable Deploy workflow
on:
  workflow_call:
    inputs:
      deploy-dir:
        description: The name of the directory to deploy
        required: false
        default: dist
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/download-artifact@v4
        with: 
          name: ${{ inputs.deploy-dir }}
      
      - name: List files
        run: ls
      
      - name: Deploy
        run: echo "Deploying from reusable workflow..."
      
