name: Lint, Test and Deploy
on:
  push:
    branches:
      - main
    paths:
      - '02-workflows-and-events/**'

defaults:
  run:
    working-directory: ./02-workflows-and-events

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with: 
          node-version: '18'
      - run: npm ci
      - run: npm run lint
  
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with: 
          node-version: '18'
      - run: npm ci
      - run: npm test
  
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Simulating deployment
        run: echo "Deploying..."