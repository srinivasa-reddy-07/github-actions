name: Trigger Workflow test

on:
  push:
    branches:
      - main
    paths:
      - '01-test-actions/**'

defaults:
  run:
    working-directory: ./01-test-actions

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm ci
      - run: npm test