name: Deploy website
on:
  push:
    branches:
      - main
    paths:
      - '03-job-artifacts-and-outputs/**'

defaults:
  run:
    working-directory: ./03-job-artifacts-and-outputs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint
      
      - name: Test code
        run: npm run test
  
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build website
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: 03-job-artifacts-and-outputs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: 03-job-artifacts-and-outputs/dist
      
      - name: Output contents
        run: ls -la

      - name: Deploy
        run: echo "Deploying..."