name: Deploy website
on:
  push:
    branches:
      - main
    paths:
      - '03-job-artifacts-and-outputs/**'
      - '.github/workflows/03-artifacts.yml'

defaults:
  run:
    working-directory: ./03-job-artifacts-and-outputs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint code
        run: npm run lint
      
      - name: Test code
        run: npm run test
  
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      js_file_name: ${{ steps.publish.outputs.script-file-name }}
    steps:
      - name: Get code
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build website
        run: npm run build
      
      - name: Publish JS file name
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'script-file-name={}' >> $GITHUB_OUTPUT ';'


      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: 03-job-artifacts-and-outputs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: 03-job-artifacts-and-outputs/dist
      
      - name: Output contents
        run: ls

      - name: Output file name
        run: echo "${{ needs.build.outputs.js_file_name }}"

      - name: Deploy
        run: echo "Deploying..."