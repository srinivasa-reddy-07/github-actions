name: Matrix Run demo
on:
  push:
    branches:
      - main
    
    paths:
      - '04-control-execution-flow/**'
      - '.github/workflows/04-execution-flow.yml'

defaults:
  run:
    working-directory: ./04-control-execution-flow

jobs:
  build:
    strategy:
      matrix:
        node-version: [ 16, 18, 20 ]
        operating-system: [ ubuntu-latest, windows-latest ]
        
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get code
        uses: actions/checkout@v6
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci
      
      - name: Build website
        id: build-website
        run: npm run build